name: Red OHC CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      performance:
        description: Paired performance measurement (off keeps correctness only)
        type: choice
        default: 'off'
        options: ['off', jdk21, all-jdks, aa-jdk21]
      base_sha:
        description: Full BASE commit SHA (required when measurement is enabled)
        type: string
      new_sha:
        description: Full NEW commit SHA (same as BASE for A/A)
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Plan / Performance scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      enabled: ${{ steps.performance.outputs.enabled }}
      jdks: ${{ steps.performance.outputs.jdks }}
      matrix: ${{ steps.performance.outputs.matrix }}
      deadline_epoch: ${{ steps.performance.outputs.deadline_epoch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Plan measurement scope and PR deadline
        id: performance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_ci_performance.py plan --plan "${{ runner.temp }}/workflow-plan.json"
  verify:
    name: Core & JMH / ${{ matrix.platform }} / JDK ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['11', '17', '21', '25']
        include:
          - {os: ubuntu-latest, platform: Linux}
          - {os: macos-latest, platform: macOS}
          - {os: windows-latest, platform: Windows}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify core and benchmark sources
        shell: bash
        run: ./mvnw -B -s config/maven/settings.xml -gs config/maven/settings.xml -Pbenchmarks -pl red-ohc-core,red-ohc-jmh -am clean verify
      - name: Verify alternative heap layouts
        shell: bash
        run: |
          for options in \
            '-XX:ObjectAlignmentInBytes=16' \
            '-XX:-UseCompressedOops -XX:-UseCompressedClassPointers' \
            '-XX:ObjectAlignmentInBytes=16 -XX:-UseCompressedOops -XX:-UseCompressedClassPointers'; do
            ./mvnw -B -s config/maven/settings.xml -gs config/maven/settings.xml \
              -pl red-ohc-core -am \
              '-Dtest=HeapLayoutTest#requestedLayoutOptionsReachTheTestJvm+entryMetadataRemainsNativeAndLifecycleCompact+entryContainsOnlyAdmissionAndNativeFields+entryHasOnlyNativeAndLifecycleFields,WriterArenaTest#pageCountersUseSeparateCacheLinesForOwnerAndReclaimerState' \
              -Dsurefire.failIfNoSpecifiedTests=false "-DargLine=$options" test
          done
      - name: Verify core with compact object headers
        if: matrix.java == '25'
        shell: bash
        run: |
          ./mvnw -B -s config/maven/settings.xml -gs config/maven/settings.xml \
            -pl red-ohc-core -am -DargLine=-XX:+UseCompactObjectHeaders test
      - name: Verify paired benchmark tooling
        if: matrix.os == 'ubuntu-latest' && matrix.java == '11'
        run: python3 -m unittest discover -s scripts -p 'test_run_paired_benchmarks.py' -v
      - name: Verify SNAPSHOT publishing tooling
        if: matrix.os == 'ubuntu-latest' && matrix.java == '11'
        run: python3 -m unittest discover -s scripts -p 'test_snapshot_publication.py' -v
      - name: Verify stable release tooling
        if: matrix.os == 'ubuntu-latest' && matrix.java == '11'
        run: python3 -m unittest discover -s scripts -p 'test_release_publication.py' -v
      - name: Install isolated performance tooling
        if: matrix.java == '21'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/performance-python"
          if [[ "$RUNNER_OS" == Windows ]]; then
            perf_python="$RUNNER_TEMP/performance-python/Scripts/python.exe"
          else
            perf_python="$RUNNER_TEMP/performance-python/bin/python"
          fi
          "$perf_python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/ci-performance-requirements.txt
          echo "PERFORMANCE_PYTHON=$perf_python" >> "$GITHUB_ENV"
      - name: Verify CI performance tooling
        if: matrix.java == '21'
        shell: bash
        run: '"$PERFORMANCE_PYTHON" -m unittest discover -s scripts -p "test_*ci_performance*.py" -v'
      - name: Check whitespace
        shell: bash
        run: git diff --check
  performance:
    name: ${{ matrix.name }}
    needs: [plan, verify]
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: needs.plan.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: needs.plan.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - name: Select performance comparison
        id: performance
        if: needs.plan.outputs.enabled == 'true'
        shell: bash
        run: python scripts/run_ci_performance.py select --jdk '${{ matrix.java }}' --plan "$RUNNER_TEMP/performance-plan.json"
      - name: Install isolated performance tooling
        if: needs.plan.outputs.enabled == 'true'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/performance-python"
          if [[ "$RUNNER_OS" == Windows ]]; then
            perf_python="$RUNNER_TEMP/performance-python/Scripts/python.exe"
          else
            perf_python="$RUNNER_TEMP/performance-python/bin/python"
          fi
          "$perf_python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/ci-performance-requirements.txt
          echo "PERFORMANCE_PYTHON=$perf_python" >> "$GITHUB_ENV"
      - name: Set common Java 11 compiler
        if: needs.plan.outputs.enabled == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '11'
      - name: Compare paired performance
        if: needs.plan.outputs.enabled == 'true'
        timeout-minutes: 25
        shell: bash
        env:
          WORKFLOW_DEADLINE: ${{ needs.plan.outputs.deadline_epoch }}
          PERFORMANCE_CASE: ${{ matrix.case }}
        run: |
          args=(run --plan "$RUNNER_TEMP/performance-plan.json"
            --output "$RUNNER_TEMP/performance-results" --compiler-home "$JAVA_HOME"
            --case "$PERFORMANCE_CASE")
          if [[ -n "$WORKFLOW_DEADLINE" ]]; then
            args+=(--workflow-deadline "$WORKFLOW_DEADLINE")
          fi
          exec "$PERFORMANCE_PYTHON" scripts/run_ci_performance.py "${args[@]}"
      - name: Retain performance evidence
        if: always() && needs.plan.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-${{ matrix.os }}-jdk${{ matrix.java }}-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/performance-plan.json
            ${{ runner.temp }}/performance-results/reports/
            ${{ runner.temp }}/performance-results/logs/
            ${{ runner.temp }}/performance-results/artifacts/
      - name: Record unmeasured performance
        if: needs.plan.outputs.enabled != 'true'
        shell: bash
        run: echo 'Performance was NOT_MEASURED; all correctness checks still ran.' >> "$GITHUB_STEP_SUMMARY"
  quality:
    name: Quality / ${{ matrix.platform }} / JDK 21
    needs: [plan, verify, performance]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - {os: ubuntu-latest, platform: Linux}
          - {os: macos-latest, platform: macOS}
          - {os: windows-latest, platform: Windows}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require core and selected performance jobs
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RESULT: ${{ needs.plan.result }}
          MEASUREMENT_ENABLED: ${{ needs.plan.outputs.enabled }}
          MEASUREMENT_JDKS: ${{ needs.plan.outputs.jdks }}
          PLATFORM: ${{ matrix.os }}
        run: >-
          python scripts/run_ci_performance.py gate --os "$PLATFORM"
          --enabled "$MEASUREMENT_ENABLED" --jdks "$MEASUREMENT_JDKS"
          --plan-result "$PLAN_RESULT"
  jcstress:
    name: Concurrency / JCStress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '11'
      - run: bash scripts/run_jcstress.sh
  example:
    name: Example / User cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '11'
      - run: ./mvnw -B -DskipTests install
      - run: ./mvnw -B -f examples/user-cache/pom.xml compile exec:exec
